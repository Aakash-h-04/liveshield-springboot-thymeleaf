spring.application.name=LiveShield
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/liveshield
spring.datasource.username=liveshield
spring.datasource.password=liveshield
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info
# ============================================================
# EMAIL NOTIFICATIONS
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

liveshield.admin.email=${ADMIN_EMAIL}


twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM}
liveshield.admin.whatsapp=${LIVESHIELD_ADMIN_WHATSAPP}